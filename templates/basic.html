<!--
  html-carousel-renderer example templates (1080×1350, 4:5).
  Contract:
    <template id="tpl-NAME">  one card; its root element is the page.
    data-slot="field"         filled with text from the post (textContent, never HTML).
    data-required             the post must provide this field.
    data-split                long text in this slot is split across pages, line by line (one per template).
    data-text                 fixed text that takes part in the overlap check.
    page / footer             filled by the renderer ("2/5" and the post's footer).
  Every slot box has a fixed size and overflow:hidden so the renderer can measure overflow.
  overflow-wrap:normal makes an unbreakable word overflow sideways instead of being cut, so it is caught.
  Fonts are not bundled: the first installed family in the list is used. Install a font such as Pretendard or Noto Sans CJK KR for Korean.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #f7f5f0; color: #15171a;
    font-family: "Pretendard", "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", "Inter", system-ui, sans-serif;
    word-break: keep-all; overflow-wrap: normal; line-break: strict; }
  [data-slot] { overflow: hidden; }
  .page { position: absolute; right: 64px; top: 60px; height: 56px; padding: 0 22px; border-radius: 28px; background: #15171a; color: #fff; font-size: 28px; line-height: 56px; font-weight: 600; white-space: nowrap; }
  .footer { position: absolute; left: 80px; bottom: 56px; width: 700px; height: 40px; font-size: 28px; line-height: 40px; font-weight: 600; color: #6b6f76; white-space: nowrap; }
  .label { position: absolute; left: 80px; top: 64px; height: 48px; font-size: 30px; line-height: 48px; font-weight: 700; color: #6b6f76; white-space: nowrap; }

  /* cover: kicker + big title + subtitle */
  .cover { background: #15171a; color: #fff; }
  .cover .kicker { position: absolute; left: 80px; top: 120px; height: 60px; padding: 0 26px; border: 3px solid #fff; border-radius: 30px; font-size: 32px; line-height: 54px; font-weight: 700; white-space: nowrap; }
  .cover .title { position: absolute; left: 80px; top: 560px; width: 900px; height: 330px; font-size: 96px; line-height: 110px; font-weight: 800; letter-spacing: -0.02em; white-space: pre-wrap; }
  .cover .subtitle { position: absolute; left: 80px; top: 930px; width: 900px; height: 150px; font-size: 40px; line-height: 60px; color: #c8ccd2; white-space: pre-wrap; }
  .cover .page { background: #fff; color: #15171a; }
  .cover .footer { color: #9aa0a8; }

  /* quote: a short quote and who said it */
  .quote .mark { position: absolute; left: 70px; top: 200px; font-size: 220px; line-height: 1; font-weight: 800; color: #d9d4c7; }
  .quote .q { position: absolute; left: 80px; top: 400px; width: 920px; height: 520px; font-size: 60px; line-height: 92px; font-weight: 700; white-space: pre-wrap; }
  .quote .by { position: absolute; left: 80px; top: 960px; width: 920px; height: 120px; font-size: 34px; line-height: 52px; color: #6b6f76; }

  /* list: one item per line, split across pages when long */
  .list .items { position: absolute; left: 80px; top: 170px; width: 920px; height: 1060px; font-size: 44px; line-height: 76px; white-space: pre-wrap; }
</style>

<template id="tpl-cover">
  <div class="card cover">
    <div class="kicker" data-slot="kicker"></div>
    <div class="title" data-slot="title" data-required></div>
    <div class="subtitle" data-slot="subtitle"></div>
    <div class="page" data-slot="page"></div><div class="footer" data-slot="footer"></div>
  </div>
</template>

<template id="tpl-quote">
  <div class="card quote">
    <div class="mark" aria-hidden="true" data-text>&ldquo;</div>
    <div class="q" data-slot="quote" data-required></div>
    <div class="by" data-slot="by"></div>
    <div class="page" data-slot="page"></div><div class="footer" data-slot="footer"></div>
  </div>
</template>

<template id="tpl-list">
  <div class="card list">
    <div class="label" data-slot="label"></div>
    <div class="items" data-slot="items" data-required data-split></div>
    <div class="page" data-slot="page"></div><div class="footer" data-slot="footer"></div>
  </div>
</template>
